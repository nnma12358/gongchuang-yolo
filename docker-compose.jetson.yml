# ============================================================
# Jetson Nano · 分拣系统（两容器：视觉 + 网关）—— 容器编排
# ------------------------------------------------------------
# 在项目根目录执行：
#   docker compose -f docker-compose.jetson.yml up -d --build
#   查看日志: docker compose -f docker-compose.jetson.yml logs -f
#   停止:     docker compose -f docker-compose.jetson.yml down
#
# 端口与通信（host 网络，互相通过 localhost 访问）：
#   检测容器  sort-yolo    :8101   YOLO 目标检测（自训练 best.onnx）
#   属性容器  sort-cnn     :8102   颜色/形状/污渍缺陷（小 CNN ONNX）
#   视觉容器  sort-vision  :8100   相机 + 三层编排 + 2.5D 高度 + 二维码 + 标记输出
#   网关容器  sort-gateway :80     前端 SPA + 分拣规则 + 自动分拣循环
#   网关 → 视觉: VISION_URL=http://127.0.0.1:8100
#   网关 → ROS2 桥接:   ROBOT_URL=http://127.0.0.1:8120（ros_bridge_ros2.py，运行在 ros2 容器内）
#   ROS2: 机械臂驱动 / Astra 相机 / MoveIt 等现有容器，与桥接共用 DDS
#
# 设备接入（相机 / 机械臂串口）：
#   默认 privileged: true 可直接访问 /dev/video*（有相机时 CAMERA_SOURCE=auto 自动识别）；
#   宿主机限制 privileged 时显式映射设备（相机 + /dev/wheeltec_controller）：
#     docker compose -f docker-compose.jetson.yml -f docker-compose.jetson-devices.yml up -d
#   无相机/无串口时保持默认即可（视觉回落到合成场景，机械臂走 dry-run）
#
# 显示屏（Jetson 本机 HDMI）：
#   bash deploy/jetson/setup-autostart.sh     # 开机自启 + kiosk 全屏
# ============================================================
services:
  # ---------------- YOLO 检测容器（视觉三层：检测层） ----------------
  sort-yolo:
    build:
      context: .
      dockerfile: deploy/jetson/Dockerfile.yolo
      args:
        # 基础镜像：国内 nvcr.io 常不可达，可在 .env 里换成代理前缀
        BASE_IMAGE: ${BASE_IMAGE:-nvcr.io/nvidia/l4t-base:r32.7.1}
    image: sort-yolo:jetson
    container_name: sort-yolo
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=Asia/Shanghai
      - PORT=8101
      - MODEL_PATH=/app/models/detect/goods_yolov8n_640_fp32.onnx
      - CLASSES_JSON=/app/models/detect/classes.json
      - IMGSZ=${YOLO_IMGSZ:-640}          # 必须与训练 imgsz 一致（本模型 640；
                                          #   现场确实漏小目标时再试 960，但那是未验证配置）
      - CONF_THRES=${YOLO_CONF:-0.35}
      - IOU_THRES=${YOLO_IOU:-0.45}
      - ENGINE=${YOLO_ENGINE:-ort}        # ort=ONNX Runtime（本镜像已装，Tegra X1 实测可用）
                                          # opencv=OpenCV DNN（apt 的 3.2 无 dnn 模块，用不了）
      - OMP_NUM_THREADS=4
      - OPENBLAS_NUM_THREADS=4
    volumes:
      - ./models:/app/models:ro           # best.onnx / classes.json（换模型不必重建镜像）
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ---------------- CNN 属性容器（视觉三层：属性层） ----------------
  sort-cnn:
    build:
      context: .
      dockerfile: deploy/jetson/Dockerfile.cnn
      args:
        # 基础镜像：国内 nvcr.io 常不可达，可在 .env 里换成代理前缀
        BASE_IMAGE: ${BASE_IMAGE:-nvcr.io/nvidia/l4t-base:r32.7.1}
    image: sort-cnn:jetson
    container_name: sort-cnn
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=Asia/Shanghai
      - PORT=8102
      - MODEL_DIR=/app/models/attr
      - TASKS=${CNN_TASKS:-color,shape,stain}
      - IMG_SIZE=96
      - CROP_MARGIN=0.12
      - ENGINE=${CNN_ENGINE:-ort}         # 同上：apt OpenCV 3.2 无 dnn，必须走 ORT
      - OMP_NUM_THREADS=2
      - OPENBLAS_NUM_THREADS=2
    volumes:
      - ./models:/app/models:ro           # color/shape/stain.onnx + *_classes.json
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ---------------- 视觉容器（视觉三层：编排 + 标记 + 2.5D） ----------------
  sort-vision:
    build:
      context: .
      dockerfile: deploy/jetson/Dockerfile.vision
      args:
        # 基础镜像：国内 nvcr.io 常不可达，可在 .env 里换成代理前缀
        BASE_IMAGE: ${BASE_IMAGE:-nvcr.io/nvidia/l4t-base:r32.7.1}
    image: sort-vision:jetson
    container_name: sort-vision
    restart: unless-stopped
    network_mode: host
    # 访问 USB 相机（/dev/video*）；无相机时同样可启动（自动合成场景）
    privileged: true
    environment:
      - TZ=Asia/Shanghai
      - PORT=8100
      - CAMERA_SOURCE=${CAMERA_SOURCE:-auto}      # auto | synthetic | index | url
      - CAMERA_INDEX=${CAMERA_INDEX:-0}
      - CAMERA_URL=${CAMERA_URL:-}
      - CAMERA_WIDTH=${CAMERA_WIDTH:-1280}
      - CAMERA_HEIGHT=${CAMERA_HEIGHT:-720}
      # 三层识别：yolo 检测 + cnn 属性（classic=纯经典 CV；yolo=三层链路，失败自动回退）
      - DETECT_ENGINE=${DETECT_ENGINE:-yolo}
      - YOLO_URL=http://127.0.0.1:8101
      - CNN_URL=http://127.0.0.1:8102
      - MODEL_PATH=${MODEL_PATH:-/app/models/detect/goods_yolov8n_640_fp32.onnx}
      - VISION_FPS=${VISION_FPS:-10}
      - CONF_MIN=${CONF_MIN:-0.45}
      # 托盘 ROI（归一化）：矩形 "x1,y1,x2,y2" 或多边形 "x1,y1;x2,y2;..."；
      # 留空=不启用。启用后"框中心在区域外"的检测一律丢弃 —— 现场出现人手/机械臂/
      # 临时杂物时的兜底（模型负样本已把背景误检压到 0，这一层防的是训练集里没有的东西）。
      # 建议按标定好的托盘范围填，例如留 6% 边距：  ROI=0.06,0.06,0.94,0.94
      - ROI=${ROI:-}
      - STAIN_DARK_RATIO=${STAIN_DARK_RATIO:-0.05}
      - DEFECT_DARK_RATIO=${DEFECT_DARK_RATIO:-0.14}
      # 相机源：默认直连 /dev/video0；也可指向 ros2 容器的 MJPEG（Astra 彩色）
      # （CAMERA_URL 已在上面定义：默认直连 /dev/video0，也可指向 ros2 容器的 MJPEG）
      # 深度来源（ros2 容器的 16-bit PNG）与逐像素桌面参考（2.5D 定位软件标定产物）
      - DEPTH_URL=${DEPTH_URL:-http://127.0.0.1:8123/depth.png}
      - TABLE_REF_DIR=/app/calibration
      # Nano 4 核：限制线程，避免与机械臂/ROS 抢 CPU
      - OMP_NUM_THREADS=${OMP_NUM_THREADS:-4}
      - OPENBLAS_NUM_THREADS=${OPENBLAS_NUM_THREADS:-4}
    volumes:
      # 2.5D 定位软件的标定产物（table_reference.npz 等）只读挂载
      - ${CALIBRATION_DIR:-./calibration}:/app/calibration:ro
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ---------------- 网关容器（前端 + 规则 + 自动分拣） ----------------
  sort-gateway:
    build:
      context: .
      dockerfile: deploy/jetson/Dockerfile
      args:
        # 基础镜像：国内 nvcr.io 常不可达，可在 .env 里换成代理前缀
        BASE_IMAGE: ${BASE_IMAGE:-nvcr.io/nvidia/l4t-base:r32.7.1}
    image: sort-gateway:jetson
    container_name: sort-gateway
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=Asia/Shanghai
      - PORT=80
      - DISPLAY_HOLD_SECONDS=${DISPLAY_HOLD_SECONDS:-3.0}
      - VISION_URL=http://127.0.0.1:8100
      - ROBOT_URL=${ROBOT_URL:-http://127.0.0.1:8120}   # ROS2 桥接；置空=不驱动机械臂
      - CALIB_PATH=/app/data/calib.json           # 标定文件（scripts/calibrate.py 生成）
      - GRASP_ENABLED=${GRASP_ENABLED:-1}         # 是否解算抓取位姿
      - AUTO_INTERVAL=${AUTO_INTERVAL:-0.6}       # 自动分拣轮询间隔(秒)
      - AUTO_CONFIRM_FRAMES=${AUTO_CONFIRM_FRAMES:-4}   # 连续 N 帧同类才入库
      - AUTO_CONF_MIN=${AUTO_CONF_MIN:-0.6}
      - AUTO_SINGLE_ITEM=${AUTO_SINGLE_ITEM:-1}   # 一次一件（赛项）
      - AUTO_DRY_RUN=${AUTO_DRY_RUN:-1}           # 1=不实际驱动机械臂（联调）
      - DETECT_ENGINE=${DETECT_ENGINE:-yolo}   # 网关侧同样走三层链路
      - MODEL_PATH=${MODEL_PATH:-/app/models/detect/goods_yolov8n_640_fp32.onnx}
    volumes:
      - sort-gateway-data:/app/data
    depends_on:
      sort-vision:
        condition: service_healthy       # 等视觉容器相机就绪再启动，避免自动分拣首帧报错
      sort-yolo:
        condition: service_started
      sort-cnn:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 768M
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ---------------- ROS 2 桥接容器（复用现场已有镜像，不重新拉取） ----------------
  # 现场已经跑通 ROS2（如 ros2_arm_container / wheeltec_ros2_astra:foxy）时：
  #   本容器**只做桥接**（HTTP :8120 ← 网关；ROS2 话题 → 机械臂）+ 深度/彩色转 HTTP（:8123），
  #   不启动任何驱动，所以不会和现场容器抢设备。
  #   基镜像 = 现场镜像（加一层 fastapi），因此**不需要联网拉镜像**。
  # 关键：ROS_DOMAIN_ID 必须与现场容器一致（默认 95）；RMW 实现也必须一致。
  #   不确定就跑：bash scripts/adopt-existing-ros2.sh   （自动探测并写进 .env）
  ros2:
    # 不重新拉 ros:foxy-ros-base！直接在现场已跑通的镜像上加一层（装 fastapi）
    build:
      context: .
      dockerfile: deploy/jetson/Dockerfile.ros-bridge
      args:
        ROS_IMAGE: ${ROS_IMAGE:-wheeltec_ros2_astra:foxy}
    image: ${ROS_BRIDGE_TAG:-sort-ros-bridge:jetson}
    platform: linux/arm64
    container_name: sort-ros-bridge
    restart: unless-stopped
    # host：与现场容器同处宿主网络（最常用）；
    # 若现场容器不是 host 网络，用 scripts/adopt-existing-ros2.sh 改成 container:<现场容器名>
    network_mode: ${ROS_NETWORK_MODE:-host}
    environment:
      - TZ=Asia/Shanghai
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-95}
      - ROS_LOCALHOST_ONLY=${ROS_LOCALHOST_ONLY:-0}
      # 留空 = 用现场镜像自带的 RMW（必须与现场容器一致，否则互相发现不了；
      #        现场若用 CycloneDDS，adopt 脚本会自动填成 rmw_cyclonedds_cpp）
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-}
      - CYCLONEDDS_URI=${CYCLONEDDS_URI:-}
      - ROS_DISTRO=${ROS_DISTRO:-foxy}
      # 桥接参数
      - PORT=${BRIDGE_PORT:-8120}
      - ARM_TOPIC=${ARM_TOPIC:-/arm/pick_place}
      - ARM_SERVICE=${ARM_SERVICE:-}
      - GATEWAY_URL=${GATEWAY_URL:-http://127.0.0.1}
      - ROS_DRY_RUN=${ROS_DRY_RUN:-0}
      - JOINT6_CLOSED=${JOINT6_CLOSED:-0.20}
      - JOINT6_OPEN=${JOINT6_OPEN:-1.20}
      - DEFAULT_PICK_Z=${DEFAULT_PICK_Z:-20.0}
      # 深度/彩色 HTTP 节点（ROSTopic → HTTP，供视觉容器 DEPTH_URL/CAMERA_URL 使用）
      - DEPTH_HTTP_PORT=${DEPTH_HTTP_PORT:-8123}
      - COLOR_TOPIC=${COLOR_TOPIC:-/overhead_camera/color/image_raw}
      - DEPTH_TOPIC=${DEPTH_TOPIC:-/overhead_camera/depth/image_raw}
      - RELIABLE_QOS=${RELIABLE_QOS:-1}
    volumes:
      - ./deploy/jetson/ros_bridge_ros2.py:/app/ros_bridge_ros2.py:ro
      - ./deploy/jetson/depth_http_node.py:/app/depth_http_node.py:ro
      - ${CYCLONEDDS_FILE:-./deploy/jetson/cyclonedds.xml}:/app/cyclonedds.xml:ro
      # 现场 ROS2 工作空间（按实际路径改；不存在时 compose 会自动建空目录）
      - ${ROS2_WS:-./.ros2_ws}:/root/ws
    working_dir: /root/ws
    command: >
      bash -lc "python3 -c 'import fastapi' 2>/dev/null ||
                python3 -m pip install --quiet --disable-pip-version-check
                -i https://mirrors.aliyun.com/pypi/simple/ 'fastapi<0.100' 'uvicorn<0.24' || true;
      python3 /app/depth_http_node.py &
      exec python3 /app/ros_bridge_ros2.py"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ---------------- 兼容：ROS 1 桥接（仅当机械臂仍跑 ROS 1 时用） ----------------
  # 默认不启动；需要时加 --profile ros1
  ros-bridge:
    image: ${ROS1_IMAGE:-ros:melodic-ros-base}
    platform: linux/arm64
    container_name: sort-ros-bridge
    restart: unless-stopped
    network_mode: host
    profiles: ["ros1"]
    volumes:
      - ./deploy/jetson/ros_bridge.py:/app/ros_bridge.py:ro
    environment:
      - ROS_MASTER_URI=http://127.0.0.1:11311
      - PORT=8121
      - ARM_ACTION=${ARM_ACTION:-/arm_pick_place}
    command: ["python3", "/app/ros_bridge.py"]
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

volumes:
  sort-gateway-data:
    name: sort-gateway-data
