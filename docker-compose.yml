# ============================================================
# PC 端 · Node 22 前端调试容器（Svelte 5）
# ------------------------------------------------------------
#   docker compose up -d --build      → 调试地址 http://localhost:5173
#   docker compose logs -f            → Vite 日志（HMR 实时生效，改完即刷新）
#
# ⚠ 必须用 **WSL 里的 docker CLI**（/usr/bin/docker），不要用 Windows 的 docker.exe：
#   docker.exe 会把 -v 的源路径按 Windows 路径解析，挂 /home/... 得到的是**空目录**
#   （表现为容器内 /app/src 为空、页面报 “src/app.html does not exist”）。
#   WSL 里的 docker CLI 走 Docker Desktop 的 docker-desktop-bind-mounts，
#   中文路径 + 源码热更新都正常（已实测）。
#
# 说明：PC 容器只是前端壳，/api/** 由 src/lib/server/proxy.js 代理到 Jetson 实际服务。
# ============================================================
services:
  svelte-dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: sort-sage:svelte-dev
    container_name: sort-svelte-dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      # 源码挂载 → Vite HMR 即时生效，改代码不用重建镜像
      - ./src:/app/src
      - ./static:/app/static
      # 数据卷（命名卷由 Docker 引擎管理）
      - sort-dev-data:/app/data
    environment:
      - NODE_ENV=development
      # 视觉容器（Jetson :8100）与网关容器（Jetson :80）地址。
      # PC 容器只做前端调试与显示；识别与自动分拣循环都跑在 Jetson 端。
      # 例：VISION_URL=http://192.168.1.50:8100  GATEWAY_URL=http://192.168.1.50
      - VISION_URL=${VISION_URL:-}
      - GATEWAY_URL=${GATEWAY_URL:-}
      # 分拣信息在屏最短保持时间（秒）—— 赛项“显示后再分拣下一件”
      - DISPLAY_HOLD_SECONDS=${DISPLAY_HOLD_SECONDS:-3.0}
      - DATA_DIR=/app/data
    command: ["npm", "run", "dev", "--", "--port", "5173"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  sort-dev-data:
    name: sort-dev-data
