# 现场真实尺度微调配方（顶置 Astra 离台面约 660mm，货物在 640 画幅里仅约 30px）
#
# 与 train_v3.yaml 的区别：
#   * root 指向重新组装的数据集（原 mix_v3 + 真实俯拍照片 + 现场几何合成）
#   * 加强尺度/平移增强，让模型适应小目标与位置抖动
#   * erase 调高：现场台面杂物多，抑制「靠背景纹理」的伪特征
#
# imgsz 说明：
#   640  —— 与当前部署的 ONNX/TRT 引擎形状一致，改完无需重建引擎（首选）
#   960+ —— 网络输入里货物像素翻倍、更接近模型原有舒适区，但必须重新导出 ONNX
#           并在 Jetson 上用 trtexec 重建引擎，推理耗时约 2~4 倍
root: "/home/xxxffyy/工创/工创yolo/data/mix_overhead"
detection_classes: ["goods"]
model: "yolov8n"
imgsz: 640
epochs: 60
batch: 8              # 6G 笔记本卡 + 与主机共享内存：8 更稳（原 16）
amp: true             # 混合精度：显存与内存都省一半左右（train_detection 读顶层 amp）
patience: 20
optimizer: "AdamW"
lr0: 0.0005           # 微调：比从头训练低一档
lrf: 0.01
warmup_epochs: 2.0
freeze: 0
# 注：AMP 的"自检"需要联网下载 yolo26n.pt，脚本里已用 YOLO_AUTOINSTALL=false 关掉；
#     这里 amp 指训练精度，true=混合精度（省显存/内存，推荐）
aug:
  # ↓ 这两项由 train_detection.py 从 aug 块读取（放在顶层不生效，已踩过）
  workers: 4          # dataloader 线程；每个都占内存（实测峰值 3.7G）；OOM 时优先降到 2
  cache: false        # 不要把数据集缓存进内存（大图集容易把主机拖进 OOM）
  hsv_h: 0.04
  hsv_s: 0.5
  hsv_v: 0.4
  fliplr: 0.5
  flipud: 0.5         # 俯拍视角下上下翻转也合理（现场摆放无方向性）
  degrees: 180.0      # 俯拍下货物朝向完全随机，允许大角度旋转
  translate: 0.15
  scale: 0.5
  mosaic: 0.8         # 小目标靠 mosaic 提升「小物体 + 多物体同框」的样本量
  close_mosaic: 12
  mixup: 0.0
  copy_paste: 0.0
  erase: 0.35
  cos_lr: true
  # （原这里又写了一次 workers: 8，会覆盖上面的设置 —— 已删除，见 aug 开头的说明）
acceptance:
  detect_map50: 0.80
